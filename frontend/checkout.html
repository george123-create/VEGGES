<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VEGGES - Checkout</title>


    <!-- CSS -->

    <link rel="stylesheet" href="../frontend-css/style.css">

    <link rel="stylesheet" href="../frontend-css/navbar.css">

    <link rel="stylesheet" href="../frontend-css/footer.css">

    <link rel="stylesheet" href="../frontend-css/checkout.css">


</head>


<body>


<!-- Navbar -->

<header>

<nav class="navbar">


<div class="logo">
    VEGGES 🥦
</div>



<ul class="nav-links">


<li>
<a href="index.html">
Home
</a>
</li>


<li>
<a href="products.html">
Products
</a>
</li>


<li>
<a href="cart.html">
Cart 🛒
</a>
</li>


</ul>


</nav>

</header>




<!-- Checkout Section -->


<section class="checkout-section">


<div class="checkout-container">



<!-- Customer Details -->


<div class="checkout-form">


<h1>
Delivery Details 📦
</h1>



<form id="checkoutForm">


<label>
Full Name
</label>

<input 
type="text"
id="name"
placeholder="Enter your name"
required>



<label>
Phone Number
</label>

<input 
type="tel"
id="phone"
placeholder="Enter phone number"
required>



<label>
Address
</label>

<textarea
id="address"
placeholder="Enter delivery address"
required></textarea>



<label>
City
</label>

<input
type="text"
id="city"
placeholder="Enter city"
required>



<label>
Pincode
</label>

<input
type="number"
id="pincode"
placeholder="Enter pincode"
required>



<button type="submit">

Continue To Payment

</button>



</form>


</div>





<!-- Order Summary -->


<div class="order-summary">


<h2>
Order Summary 🛒
</h2>


<div id="checkoutItems">


</div>



<h3>

Total:
<span id="checkoutTotal">
₹0
</span>

</h3>



</div>




</div>


</section>






<footer>

<p>
© 2026 VEGGES. Fresh vegetables delivered.
</p>

</footer>



<script src="../frontend-js/checkout.js"></script>


</body>

</html>
