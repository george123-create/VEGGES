<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VEGGES - Register</title>

    <link rel="stylesheet" href="../frontend-css/style.css">
    <link rel="stylesheet" href="../frontend-css/navbar.css">
    <link rel="stylesheet" href="../frontend-css/footer.css">
    <link rel="stylesheet" href="../frontend-css/auth.css">
   
</head>

<body>

    <!-- Navbar -->
    <header>
        <nav class="navbar">

            <div class="logo">
                VEGGES 🥦
            </div>

            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="#">Products</a></li>
                <li><a href="login.html">Login</a></li>
            </ul>

        </nav>
    </header>


   <section class="auth-section">

    <div class="auth-box">


        <!-- LEFT SIDE -->

        <div class="auth-left">

            <h1>VEGGES 🥦</h1>

            <h2>Fresh Food, Fresh Life</h2>

            <p>
                Create your VEGGES account and enjoy
                fresh vegetables delivered to your doorstep.
            </p>

        </div>



        <!-- RIGHT SIDE -->

        <div class="auth-right">


            <h2>Create Account</h2>


            <form id="registerForm">


                <input 
                type="text"
                id="name"
                placeholder="Full Name"
                required>


                <input 
                type="email"
                id="email"
                placeholder="Email Address"
                required>


                <input 
                type="password"
                id="password"
                placeholder="Password"
                required>


                <input 
                type="password"
                id="confirmPassword"
                placeholder="Confirm Password"
                required>


                <button type="submit">
                    Register
                </button>


                <p>
                    Already have an account?
                    <a href="login.html">
                        Login
                    </a>
                </p>


            </form>


        </div>


    </div>

</section>


    <!-- Footer -->

    <footer>
        <p>
            © 2026 VEGGES. Fresh vegetables delivered.
        </p>
    </footer>


<script src="../frontend-js/api.js"></script>
<script src="../frontend-js/regester.js"></script>
</body>
</html>
