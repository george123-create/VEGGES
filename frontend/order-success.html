
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VEGGES - Order Success</title>


    <!-- CSS -->

    <link rel="stylesheet" href="../frontend-css/style.css">

    <link rel="stylesheet" href="../frontend-css/navbar.css">

    <link rel="stylesheet" href="../frontend-css/footer.css">

    <link rel="stylesheet" href="../frontend-css/order-success.css">


</head>


<body>


<!-- Navbar -->

<header>

    <nav class="navbar">

        <div class="logo">
            VEGGES 🥦
        </div>


        <ul class="nav-links">

            <li>
                <a href="index.html">
                    Home
                </a>
            </li>


            <li>
                <a href="products.html">
                    Products
                </a>
            </li>


            <li>
                <a href="order.html">
                    My Orders
                </a>
            </li>

        </ul>

    </nav>

</header>


<!-- Success Section -->

<section class="success-section">

    <div class="success-container">


        <div class="success-icon">
            ✓
        </div>


        <h1>
            Order Placed Successfully! 🎉
        </h1>


        <p>
            Thank you for shopping with VEGGES 🥦
        </p>


        <div class="order-details">

            <h2>
                Order Details
            </h2>


            <p>
                Order ID:
                <span id="orderId">
                </span>
            </p>


            <p>
                Customer:
                <span id="customerName">
                </span>
            </p>


            <p>
                Total Amount:
                <span id="orderAmount">
                </span>
            </p>


            <p>
                Payment Method:
                <span id="paymentMethod">
                </span>
            </p>

        </div>


        <div class="success-buttons">


            <!-- Continue Shopping -->

            <a href="products.html">

                <button>
                    Continue Shopping
                </button>

            </a>


            <!-- View Exact Current Order -->

            <a href="order.html" id="viewOrderBtn">

                <button>
                    View Order
                </button>

            </a>


        </div>


    </div>

</section>


<footer>

    <p>
        © 2026 VEGGES. Fresh vegetables delivered.
    </p>

</footer>


<script src="../frontend-js/order-success.js"></script>


</body>

</html>
